[package]
name = "diktate-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
cpal = "0.15"
diktate-whispercpp-sys.workspace = true
voice_activity_detector = "0.2"
serde_json.workspace = true

[dev-dependencies]
hound = "3"

# Backend obliczeniowy whisper.cpp: cecha `vulkan` jest domyślna, odkąd na
# tym sprzęcie (Intel Meteor Lake, iGPU Arc) okazała się wyraźnie szybsza niż
# CPU przy whisperze. `cargo build --no-default-features` nadal daje czysty
# build na CPU.
#
# Cecha dotyczy whispera, nie parakeeta: parakeet liczy na rdzeniach zawsze,
# bo na tym iGPU jego enkoder jest 2,5× wolniejszy niż na CPU (docs/12).
# Oba modele dzielą jednak jedną kopię ggml, więc backend Vulkan buduje się
# raz i whisper z niego korzysta niezależnie od decyzji parakeeta.
[features]
default = ["vulkan"]
vulkan = ["diktate-whispercpp-sys/vulkan"]

[build-dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
