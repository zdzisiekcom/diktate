[package]
name = "diktate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
# Zależność podana wprost ścieżką (zamiast `diktate-core.workspace = true`),
# żeby `default-features = false` faktycznie zadziałało — cargo ignoruje tę
# opcję przy dziedziczeniu z workspace.dependencies, jeśli sam wpis w
# workspace.dependencies nie deklaruje `default-features`.
diktate-core = { path = "../diktate-core", default-features = false }
diktate-config.workspace = true
diktate-proto.workspace = true
serde.workspace = true
toml = "0.8"
hound = "3"
# rustls, nie natywne TLS: OpenSSL w tym środowisku nie ma nagłówków
# (patrz CLAUDE.md, „Pułapki tego środowiska”), a pobranie jednego pliku
# nie jest powodem, żeby wracać do tamtego problemu.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

# Przekazanie wyboru backendu dalej do diktate-core. Domyślnie Vulkan — patrz
# komentarz w crates/diktate-core/Cargo.toml. `diktate-core` ma
# `default-features = false` (patrz wyżej), więc trzeba tu jawnie włączyć
# `vulkan` domyślnie, żeby faktycznie się propagowało. CPU:
# `cargo build -p diktate-cli --no-default-features`.
[features]
default = ["vulkan"]
vulkan = ["diktate-core/vulkan"]
